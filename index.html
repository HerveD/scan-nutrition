<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101518">
<title>Scanner un code-barres</title>
<!--
  Page de scan du code-barres (lot 5 bis) : une seule page, aucune donnée personnelle.
  Elle lit le code avec la caméra, puis renvoie vers l'application avec ?scan=CODE.
  Paramètre d'adresse :  ?retour=ADRESSE_DE_L_APPLICATION  (accepté seulement si elle commence par
  https://script.google.com/macros/). Sans « retour », la page affiche simplement le code lu (mode test).
  Le lecteur ZXing est copié dans le fichier zxing.min.js (même dossier), sans appel à un site tiers.
-->
<style>
  :root { --fond:#101518; --carte:#1a2125; --texte:#e4ebe9; --doux:#9eabad; --accent:#6fc0cf;
          --bouton:#2b7384; --sur-bouton:#ffffff; --bord:#2d383d; --ko:#ff8a80; --ok:#7fd48a; --alerte:#f0a640; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--fond); color:var(--texte);
               font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size:17px; }
  body { display:flex; flex-direction:column; min-height:100%; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding:12px 16px 6px; }
  h1 { margin:0; font-size:20px; }
  .sous { color:var(--doux); font-size:14px; margin-top:2px; }
  #zoneVideo { position:relative; margin:8px 16px; border-radius:14px; overflow:hidden; background:#000;
               height:42vh; min-height:220px; max-height:420px; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  #viseur { position:absolute; left:8%; right:8%; top:30%; bottom:30%; border:2px solid rgba(255,255,255,.85);
            border-radius:10px; box-shadow:0 0 0 9999px rgba(0,0,0,.35); pointer-events:none; }
  #viseur::after { content:''; position:absolute; left:6%; right:6%; top:50%; height:2px; background:rgba(255,80,80,.9); }
  #zoneVideo.trouve #viseur { border-color:var(--ok); }
  #zoneVideo.trouve #viseur::after { background:var(--ok); }
  #message { margin:4px 16px; min-height:48px; font-size:17px; line-height:1.35; }
  #message.ko { color:var(--ko); } #message.ok { color:var(--ok); } #message.info { color:var(--texte); }
  .rangee { display:flex; gap:10px; padding:6px 16px; flex-wrap:wrap; }
  button { min-height:48px; padding:0 16px; border:0; border-radius:12px; background:var(--carte); color:var(--texte);
           font-size:16px; font-weight:bold; border:1px solid var(--bord); cursor:pointer; }
  button.principal { background:var(--bouton); color:var(--sur-bouton); border-color:var(--bouton); }
  button:disabled { opacity:.45; }
  #panneauNumero, #panneauResultat { margin:6px 16px; padding:14px; background:var(--carte); border:1px solid var(--bord); border-radius:14px; }
  .masque { display:none !important; }
  input { width:100%; min-height:52px; font-size:22px; letter-spacing:2px; padding:0 12px; border-radius:10px;
          border:1px solid var(--bord); background:#222b30; color:var(--texte); }
  .code-gros { font-size:34px; letter-spacing:3px; font-weight:bold; text-align:center; margin:6px 0 12px; word-break:break-all; }
  details { margin:10px 16px 18px; color:var(--doux); font-size:13px; }
  pre { white-space:pre-wrap; word-break:break-word; margin:6px 0 0; font-size:12px; }
  footer { margin-top:auto; padding:6px 16px 10px; color:var(--doux); font-size:12px; }
</style>
</head>
<body>

<header>
  <h1>📷 Scanner un code-barres</h1>
  <div class="sous" id="sousTitre">Place le code dans le cadre, bien éclairé.</div>
</header>

<div id="zoneVideo">
  <video id="video" playsinline muted autoplay></video>
  <div id="viseur"></div>
</div>
<div id="message" class="info" role="status" aria-live="polite">Démarrage de la caméra…</div>

<div class="rangee" id="boutons">
  <button id="boutonLampe" class="masque">🔦 Lampe</button>
  <button id="boutonNumero">⌨ Saisir le numéro</button>
  <button id="boutonAnnuler">✕ Annuler</button>
</div>

<div id="panneauNumero" class="masque">
  <label for="champNumero" style="display:block;margin-bottom:8px;color:var(--doux);font-size:15px">Les chiffres sous le code-barres (13 ou 8)</label>
  <input id="champNumero" type="text" inputmode="numeric" autocomplete="off" placeholder="3017620422003">
  <div class="rangee" style="padding:10px 0 0">
    <button id="boutonValiderNumero" class="principal">Valider</button>
    <button id="boutonFermerNumero">Revenir à la caméra</button>
  </div>
</div>

<div id="panneauResultat" class="masque">
  <div class="sous">Code lu (mode test : aucune application n'est reliée)</div>
  <div class="code-gros" id="codeLu"></div>
  <div class="rangee" style="padding:0">
    <button id="boutonCopier" class="principal">Copier le code</button>
    <button id="boutonRelancer">Scanner un autre</button>
  </div>
</div>

<details>
  <summary>Informations techniques (à me copier en cas de problème)</summary>
  <pre id="technique"></pre>
</details>
<footer id="pied"></footer>

<script>
'use strict';
var VERSION = '1.0';
var FORMATS = ['ean_13', 'ean_8', 'upc_a'];
var HOTE_AUTORISE = 'script.google.com';
var DELAI_CONSEIL_MS = 15000;

function el(id) { return document.getElementById(id); }
var journal = [];
function noter(texte) {
  var h = new Date();
  var s = (h.getHours() < 10 ? '0' : '') + h.getHours() + ':' + (h.getMinutes() < 10 ? '0' : '') + h.getMinutes() + ':' + (h.getSeconds() < 10 ? '0' : '') + h.getSeconds();
  journal.push('[' + s + '] ' + texte);
  if (journal.length > 60) journal.shift();
  el('technique').textContent = journal.join('\n');
}
function message(texte, genre) {
  var m = el('message');
  m.textContent = texte;
  m.className = genre || 'info';
}

/* ---------- Adresse de retour : seulement vers une application Apps Script ---------- */
var parametres = new URLSearchParams(location.search);
var retourBrut = parametres.get('retour') || '';
var retour = null;
if (retourBrut) {
  try {
    var u = new URL(retourBrut);
    if (u.protocol === 'https:' && u.hostname === HOTE_AUTORISE && u.pathname.indexOf('/macros/') === 0) retour = u;
  } catch (e) { retour = null; }
}
el('pied').textContent = 'Page de scan v' + VERSION + (retour ? ' · retour vers ton application' : ' · mode test');
if (retourBrut && !retour) {
  noter('Adresse de retour refusée : ' + retourBrut.slice(0, 80));
  message('⚠ Adresse de retour refusée (elle ne mène pas à une application Google Apps Script). Mode test : le code sera seulement affiché.', 'ko');
}
if (!retour) el('boutonAnnuler').classList.add('masque');

/* ---------- Contrôle du code : clé de contrôle GS1 ---------- */
function cleValide(chiffres) {
  var somme = 0;
  var n = chiffres.length;
  for (var i = 0; i < n - 1; i++) {
    var c = chiffres.charCodeAt(n - 2 - i) - 48;
    somme += c * (i % 2 === 0 ? 3 : 1);
  }
  return ((10 - (somme % 10)) % 10) === (chiffres.charCodeAt(n - 1) - 48);
}
function touteChiffres(t) {
  if (!t) return false;
  for (var i = 0; i < t.length; i++) { var c = t.charCodeAt(i); if (c < 48 || c > 57) return false; }
  return true;
}
/* Renvoie le code normalisé (UPC-A de 12 chiffres devient un EAN-13 avec un 0 devant) ou '' s'il est invalide */
function normaliser(brut) {
  var t = String(brut || '').split(' ').join('');
  if (!touteChiffres(t)) return '';
  if (t.length !== 8 && t.length !== 12 && t.length !== 13) return '';
  if (!cleValide(t)) return '';
  return t.length === 12 ? '0' + t : t;
}

/* ---------- Caméra ---------- */
var flux = null;
var piste = null;
var arrete = false;
var detecteur = null;
var lecteurZxing = null;
var methode = '';
var lampeAllumee = false;
var derniereLecture = { code: '', n: 0, t: 0 };
var debutLecture = 0;
var conseilDonne = false;

async function demarrerCamera() {
  arrete = false;
  conseilDonne = false;
  derniereLecture = { code: '', n: 0, t: 0 };
  el('zoneVideo').classList.remove('trouve');
  el('panneauResultat').classList.add('masque');
  el('zoneVideo').classList.remove('masque');
  el('boutons').classList.remove('masque');
  message('Démarrage de la caméra…', 'info');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    noter('getUserMedia absent');
    problemeCamera('Cette page ne peut pas utiliser la caméra (navigateur ancien, ou adresse non sécurisée).');
    return;
  }
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
  } catch (e) {
    noter('Caméra refusée ou absente : ' + e.name + ' ' + (e.message || ''));
    if (e.name === 'NotAllowedError' || e.name === 'SecurityError') {
      problemeCamera('L’accès à la caméra est refusé. Autorise-le (cadenas à gauche de l’adresse › Autorisations › Caméra), ou tape le numéro.');
    } else if (e.name === 'NotFoundError' || e.name === 'OverconstrainedError') {
      problemeCamera('Aucune caméra trouvée. Tape le numéro sous le code-barres.');
    } else {
      problemeCamera('Impossible de démarrer la caméra (' + e.name + '). Tape le numéro sous le code-barres.');
    }
    return;
  }
  piste = flux.getVideoTracks()[0];
  var video = el('video');
  video.srcObject = flux;
  try { await video.play(); } catch (e) { noter('play : ' + e.name); }
  var caps = {};
  try { caps = piste.getCapabilities ? piste.getCapabilities() : {}; } catch (e) { caps = {}; }
  try {
    if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) await piste.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
  } catch (e) { noter('mise au point : ' + e.name); }
  var r = piste.getSettings ? piste.getSettings() : {};
  noter('Caméra : ' + (r.width || '?') + 'x' + (r.height || '?') + ', mise au point ' + (r.focusMode || '?') + ', lampe ' + (caps.torch ? 'oui' : 'non'));
  el('boutonLampe').classList.toggle('masque', !caps.torch);
  lampeAllumee = false;
  el('boutonLampe').textContent = '🔦 Lampe';
  /* ne pas écraser un message plus récent (ex. numéro refusé pendant le démarrage) */
  if (el('message').textContent === 'Démarrage de la caméra…') message('Place le code dans le cadre, bien éclairé et net.', 'info');
  debutLecture = Date.now();
  await preparerLecteur();
  boucleLecture();
}

function problemeCamera(texte) {
  message('✘ ' + texte, 'ko');
  el('zoneVideo').classList.add('masque');
  ouvrirNumero();
}

function arreterCamera() {
  arrete = true;
  if (flux) { flux.getTracks().forEach(function (p) { p.stop(); }); flux = null; piste = null; }
  el('video').srcObject = null;
}

function chargerZxing() {
  return new Promise(function (resoudre, rejeter) {
    if (window.ZXing) { resoudre(); return; }
    var s = document.createElement('script');
    s.src = 'zxing.min.js?v=0.21.3';
    s.onload = function () { resoudre(); };
    s.onerror = function () { rejeter(new Error('fichier zxing.min.js introuvable')); };
    document.head.appendChild(s);
  });
}

async function preparerLecteur() {
  detecteur = null;
  if ('BarcodeDetector' in window) {
    try {
      var dispo = await BarcodeDetector.getSupportedFormats();
      var formats = FORMATS.filter(function (f) { return dispo.indexOf(f) !== -1; });
      if (formats.length) { detecteur = new BarcodeDetector({ formats: formats }); methode = 'BarcodeDetector (' + formats.join(', ') + ')'; }
    } catch (e) { noter('BarcodeDetector indisponible : ' + e.name); }
  }
  if (!detecteur) {
    try {
      await chargerZxing();
      var indices = new Map();
      indices.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A]);
      indices.set(ZXing.DecodeHintType.TRY_HARDER, true);
      lecteurZxing = new ZXing.MultiFormatReader();
      lecteurZxing.setHints(indices);
      methode = 'ZXing';
    } catch (e) {
      noter('ZXing : ' + e.message);
      problemeCamera('Le lecteur de code-barres n’a pas pu se charger. Tape le numéro sous le code-barres.');
      arreterCamera();
      return;
    }
  }
  noter('Lecteur : ' + methode);
}

var toile = document.createElement('canvas');
function lireAvecZxing(video) {
  var vl = video.videoWidth;
  var vh = video.videoHeight;
  if (!vl || !vh) return '';
  /* bande centrale de l'image : le code est horizontal, on lit moins de pixels */
  var sh = Math.round(vh * 0.6);
  var sy = Math.round((vh - sh) / 2);
  var l = Math.min(vl, 1000);
  var h = Math.round(sh * l / vl);
  toile.width = l;
  toile.height = h;
  var ctx = toile.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, 0, sy, vl, sh, 0, 0, l, h);
  var px = ctx.getImageData(0, 0, l, h).data;
  var gris = new Uint8ClampedArray(l * h);
  for (var i = 0; i < l * h; i++) gris[i] = px[i * 4] * 0.299 + px[i * 4 + 1] * 0.587 + px[i * 4 + 2] * 0.114;
  var bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(gris, l, h)));
  try { return lecteurZxing.decode(bitmap).getText(); } catch (e) { return ''; }
}

async function boucleLecture() {
  if (arrete) return;
  var brut = '';
  try {
    var video = el('video');
    if (detecteur) {
      var trouves = await detecteur.detect(video);
      if (trouves && trouves.length) brut = trouves[0].rawValue;
    } else if (lecteurZxing) {
      brut = lireAvecZxing(video);
    }
  } catch (e) { noter('lecture : ' + e.name + ' ' + (e.message || '')); }
  if (brut) lectureRecue(brut);
  if (!conseilDonne && !arrete && Date.now() - debutLecture > DELAI_CONSEIL_MS) {
    conseilDonne = true;
    message('Rien de lisible pour l’instant. Éloigne un peu le téléphone (15 à 20 cm), évite les reflets, allume la lampe, ou saisis le numéro.', 'info');
  }
  if (!arrete) setTimeout(boucleLecture, detecteur ? 120 : 110);
}

/* Une lecture est acceptée si la clé est valide ET si le même code est lu deux fois de suite (anti-erreur) */
function lectureRecue(brut) {
  if (arrete) return;
  var code = normaliser(brut);
  if (!code) { noter('Lecture rejetée (clé invalide ou longueur) : ' + String(brut).slice(0, 20)); return; }
  var maintenant = Date.now();
  if (derniereLecture.code === code && maintenant - derniereLecture.t < 2500) derniereLecture.n++;
  else derniereLecture = { code: code, n: 1, t: maintenant };
  derniereLecture.t = maintenant;
  if (derniereLecture.n >= 2) succes(code, 'caméra');
  else message('Lecture… ' + code, 'info');
}

function succes(code, origine) {
  if (arrete && origine === 'caméra') return;
  arreterCamera();
  noter('Code accepté : ' + code + ' (' + origine + ')');
  el('zoneVideo').classList.add('trouve');
  if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) { noter('vibration refusée'); } }
  message('✔ Code ' + code + ' lu.' + (retour ? ' Retour vers ton application…' : ''), 'ok');
  if (retour) {
    var cible = new URL(retour.toString());
    cible.searchParams.set('scan', code);
    cible.searchParams.set('t', String(Date.now()));
    setTimeout(function () { location.replace(cible.toString()); }, 350);
  } else {
    el('codeLu').textContent = code;
    el('panneauNumero').classList.add('masque');
    el('zoneVideo').classList.add('masque');
    el('boutons').classList.add('masque');
    el('panneauResultat').classList.remove('masque');
  }
}

/* ---------- Boutons ---------- */
el('boutonLampe').addEventListener('click', async function () {
  if (!piste) return;
  lampeAllumee = !lampeAllumee;
  try {
    await piste.applyConstraints({ advanced: [{ torch: lampeAllumee }] });
    el('boutonLampe').textContent = lampeAllumee ? '🔦 Éteindre' : '🔦 Lampe';
  } catch (e) {
    lampeAllumee = false;
    noter('lampe : ' + e.name);
    message('La lampe n’a pas pu être allumée.', 'ko');
  }
});

function ouvrirNumero() {
  el('panneauNumero').classList.remove('masque');
  el('champNumero').focus();
}
el('boutonNumero').addEventListener('click', ouvrirNumero);
el('boutonFermerNumero').addEventListener('click', function () {
  el('panneauNumero').classList.add('masque');
  if (!flux) demarrerCamera();
});
function validerNumero() {
  var code = normaliser(el('champNumero').value);
  if (!code) {
    message('✘ Ce numéro n’est pas valide (13, 12 ou 8 chiffres, avec le bon chiffre de contrôle). Vérifie chaque chiffre.', 'ko');
    return;
  }
  succes(code, 'saisie');
}
el('boutonValiderNumero').addEventListener('click', validerNumero);
el('champNumero').addEventListener('keydown', function (e) { if (e.key === 'Enter') validerNumero(); });

el('boutonAnnuler').addEventListener('click', function () {
  arreterCamera();
  if (!retour) return;
  var cible = new URL(retour.toString());
  cible.searchParams.set('scan', 'annule');
  cible.searchParams.set('t', String(Date.now()));
  noter('Annulé : retour vers l’application');
  location.replace(cible.toString());
});

el('boutonCopier').addEventListener('click', async function () {
  try { await navigator.clipboard.writeText(el('codeLu').textContent); message('Code copié.', 'ok'); }
  catch (e) { message('Copie impossible : note le code à la main.', 'ko'); }
  el('panneauResultat').classList.remove('masque');
});
el('boutonRelancer').addEventListener('click', function () { demarrerCamera(); });

/* Retour sur la page avec le bouton « précédent » : la caméra doit être relancée */
window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && flux && el('video').paused) el('video').play();
});
window.addEventListener('pagehide', arreterCamera);

noter('Page de scan v' + VERSION + ' ; navigateur : ' + navigator.userAgent.slice(0, 110));
demarrerCamera();
</script>
</body>
</html>
